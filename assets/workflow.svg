<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Automation flow: new lead, AI analysis, send reply, notify team, save to CRM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffd"/>
      <stop offset="1" stop-color="#e0f8ef"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0fb98a" stroke-opacity=".07"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0fb98a" flood-opacity=".22"/>
    </filter>
    <g id="ok">
      <circle r="10" fill="#19d6a2"/>
      <path d="M-4.5 0.5 L-1.5 3.5 L5 -3.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .nt { font-size: 18px; font-weight: 700; fill: #0b1f1c; }
    .nd { font-size: 12.5px; fill: #6f8b86; }
    .flow { stroke-dasharray: 5 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -11; } }
  </style>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>

  <text class="sans" x="50" y="46" font-size="12" letter-spacing="4" font-weight="600" fill="#0fb98a">HOW A TYPICAL AUTOMATION WORKS</text>
  <rect x="50" y="56" width="34" height="2" rx="1" fill="#19d6a2"/>

  <!-- connectors -->
  <g fill="none" stroke="#19d6a2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="flow">
    <path d="M240 175 H320"/>
    <path d="M510 175 H565 V100 H620"/>
    <path d="M510 175 H565 V250 H620"/>
    <path d="M810 100 H865 V175 H920"/>
    <path d="M810 250 H865 V175 H920"/>
  </g>
  <g fill="#0fb98a">
    <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240 175 H320"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M510 175 H565 V100 H620"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M510 175 H565 V250 H620"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin=".4s" repeatCount="indefinite" path="M810 100 H865 V175 H920"/></circle>
    <circle r="4.5"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite" path="M810 250 H865 V175 H920"/></circle>
  </g>

  <!-- node: new lead -->
  <g filter="url(#sh)">
    <rect x="50" y="125" width="190" height="100" rx="18" fill="#ffffff" stroke="#d3f2e8"/>
  </g>
  <circle cx="86" cy="158" r="17" fill="#e4faf3"/>
  <path d="M80 151 L80 166 L84 162 L87 168 L89.500 167 L86.500 161 L92 161Z" fill="#0fb98a"/>
  <text class="sans nt" x="70" y="201">New lead</text>
  <text class="sans nd" x="70" y="216">form · email · API</text>
  <use href="#ok" x="230" y="125"/>

  <!-- node: AI analysis -->
  <g filter="url(#sh)">
    <rect x="320" y="125" width="190" height="100" rx="18" fill="#ffffff" stroke="#d3f2e8"/>
  </g>
  <circle cx="356" cy="158" r="17" fill="#e4faf3"/>
  <path d="M356 146 Q356 158 368 158 Q356 158 356 170 Q356 158 344 158 Q356 158 356 146Z" fill="#0fb98a" stroke="#0fb98a" stroke-width="2" stroke-linejoin="round"/>
  <text class="sans nt" x="340" y="201">AI analysis</text>
  <text class="sans nd" x="340" y="216">classify · decide</text>
  <use href="#ok" x="500" y="125"/>

  <!-- node: send reply -->
  <g filter="url(#sh)">
    <rect x="620" y="50" width="190" height="100" rx="18" fill="#ffffff" stroke="#d3f2e8"/>
  </g>
  <circle cx="656" cy="83" r="17" fill="#e4faf3"/>
  <rect x="646" y="77" width="20" height="14" rx="2.500" fill="none" stroke="#0fb98a" stroke-width="2.2"/>
  <path d="M646.500 78 L656 85.500 L665.500 78" fill="none" stroke="#0fb98a" stroke-width="2.2" stroke-linejoin="round"/>
  <text class="sans nt" x="640" y="126">Send reply</text>
  <text class="sans nd" x="640" y="141">email · message</text>
  <use href="#ok" x="800" y="50"/>

  <!-- node: notify team -->
  <g filter="url(#sh)">
    <rect x="620" y="200" width="190" height="100" rx="18" fill="#ffffff" stroke="#d3f2e8"/>
  </g>
  <circle cx="656" cy="233" r="17" fill="#e4faf3"/>
  <path d="M647 238 Q647 226 656 226 Q665 226 665 238 L667 240 H645Z" fill="none" stroke="#0fb98a" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="656" cy="243" r="2.500" fill="#0fb98a"/>
  <text class="sans nt" x="640" y="276">Notify team</text>
  <text class="sans nd" x="640" y="291">Slack · Teams</text>
  <use href="#ok" x="800" y="200"/>

  <!-- node: CRM -->
  <g filter="url(#sh)">
    <rect x="920" y="125" width="190" height="100" rx="18" fill="#ffffff" stroke="#d3f2e8"/>
  </g>
  <circle cx="956" cy="158" r="17" fill="#e4faf3"/>
  <ellipse cx="956" cy="151" rx="9" ry="3.500" fill="none" stroke="#0fb98a" stroke-width="2.200"/>
  <path d="M947 151 V165 Q947 169 956 169 Q965 169 965 165 V151" fill="none" stroke="#0fb98a" stroke-width="2.200"/>
  <text class="sans nt" x="940" y="201">Save to CRM</text>
  <text class="sans nd" x="940" y="216">database · sheets</text>
  <use href="#ok" x="1100" y="125"/>
</svg>
