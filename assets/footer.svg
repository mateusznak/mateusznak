<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Let's talk - rothcor.pl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fffd"/>
      <stop offset="1" stop-color="#def7ee"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cf0bb"/>
      <stop offset="1" stop-color="#14d8a1"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0fb98a" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14d8a1" flood-opacity=".45"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .cta { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  </style>

  <rect width="1200" height="170" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="170" rx="20" fill="url(#grid)"/>

  <g class="cta" filter="url(#glow)">
    <rect x="330" y="30" width="540" height="76" rx="38" fill="url(#mint)"/>
    <circle cx="372" cy="68" r="24" fill="#0b1f1c"/>
    <path d="M362 61 H382 a2 2 0 0 1 2 2 V73 a2 2 0 0 1 -2 2 H372 L366 80 V75 H362 a2 2 0 0 1 -2 -2 V63 a2 2 0 0 1 2 -2Z" fill="none" stroke="#3cf0bb" stroke-width="2" stroke-linejoin="round"/>
    <text class="sans" x="600" y="77" text-anchor="middle" font-size="25" font-weight="700" fill="#0b1f1c">Let's talk · rothcor.pl</text>
    <circle cx="828" cy="68" r="24" fill="#0b1f1c"/>
    <path d="M817 68 H838 M831 61 L838 68 L831 75" fill="none" stroke="#ffffff" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="sans" x="600" y="146" text-anchor="middle" font-size="12" letter-spacing="6" fill="#6f8b86">IDEAS  ·  TECHNOLOGY  ·  REAL RESULTS</text>
</svg>
