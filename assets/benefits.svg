<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Less manual work, more time, better process">
  <defs>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0fb98a" flood-opacity=".2"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 20px; font-weight: 700; fill: #0b1f1c; }
    .s { font-size: 13px; fill: #6f8b86; }
    .hand { transform-box: fill-box; transform-origin: 50% 100%; animation: tick 6s linear infinite; }
    @keyframes tick { to { transform: rotate(360deg); } }
  </style>

  <!-- pill 1 -->
  <g filter="url(#sh)"><rect x="24" y="20" width="368" height="80" rx="40" fill="#ffffff" stroke="#d3f2e8"/></g>
  <circle cx="72" cy="60" r="26" fill="#e4faf3"/>
  <circle cx="72" cy="60" r="14" fill="none" stroke="#0fb98a" stroke-width="2.6"/>
  <line class="hand" x1="72" y1="60" x2="72" y2="51" stroke="#0fb98a" stroke-width="2.6" stroke-linecap="round"/>
  <text class="sans t" x="116" y="56">Less manual work</text>
  <text class="sans s" x="116" y="78">repetitive tasks run themselves</text>

  <!-- pill 2 -->
  <g filter="url(#sh)"><rect x="416" y="20" width="368" height="80" rx="40" fill="#ffffff" stroke="#d3f2e8"/></g>
  <circle cx="464" cy="60" r="26" fill="#e4faf3"/>
  <g fill="#0fb98a"><rect x="451" y="62" width="7" height="12" rx="2"/><rect x="461" y="54" width="7" height="20" rx="2"/><rect x="471" y="46" width="7" height="28" rx="2"/></g>
  <text class="sans t" x="508" y="56">More time</text>
  <text class="sans s" x="508" y="78">for clients, growth and ideas</text>

  <!-- pill 3 -->
  <g filter="url(#sh)"><rect x="808" y="20" width="368" height="80" rx="40" fill="#ffffff" stroke="#d3f2e8"/></g>
  <circle cx="856" cy="60" r="26" fill="#e4faf3"/>
  <circle cx="856" cy="60" r="9" fill="none" stroke="#0fb98a" stroke-width="5" stroke-dasharray="4.5 3.2"/>
  <circle cx="856" cy="60" r="3.500" fill="#0fb98a"/>
  <text class="sans t" x="900" y="56">Better process</text>
  <text class="sans s" x="900" y="78">clear, measurable, repeatable</text>
</svg>
